name: AOTL Humanoid Master V02 — Godot QA
on:
  pull_request:
    paths:
      - "game/crownsfall_lootslice/**"
      - ".github/workflows/aotl_rig_v02.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  humanoid-v02:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Restore SHA-256 verified original exported GLB
        run: python game/crownsfall_lootslice/tools/restore_rig_v02.py
      - name: Install Godot 4.6.3
        run: |
          curl --fail --location --silent --show-error --retry 3 'https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip' -o /tmp/godot463.zip
          unzip -q /tmp/godot463.zip -d /tmp
          sudo install -m 0755 /tmp/Godot_v4.6.3-stable_linux.x86_64 /usr/local/bin/godot
          godot --version
      - name: Import both 3D rigs into Godot
        run: godot --headless --path game/crownsfall_lootslice --editor --quit
      - name: Verify 16 V02 action clips, blend tree and sockets
        run: |
          set -o pipefail
          godot --headless --path game/crownsfall_lootslice --script res://tests/rig_v02_smoke.gd -- --aotl-rig-v02 2>&1 | tee /tmp/aotl-rig-v02-smoke.log
          grep -q "RIG_V02_TEST_OK" /tmp/aotl-rig-v02-smoke.log
          if grep -E "SCRIPT ERROR:|Parse Error:|Invalid call\\." /tmp/aotl-rig-v02-smoke.log; then
            echo "Unexpected Godot script error; failing even if smoke assertion count passed"
            exit 1
          fi
      - name: Preserve all existing gameplay regressions
        run: python game/crownsfall_lootslice/tools/run_checks.py --report-dir /tmp/aotl-v02-qa
      - name: Package portable V02 rig and QA
        if: success()
        run: |
          mkdir -p /tmp/aotl-v02-delivery
          cp game/crownsfall_lootslice/models/AOTL_Humanoid_Master_V02.glb /tmp/aotl-v02-delivery/
          cp game/crownsfall_lootslice/data/humanoid_v02_reel_manifest.json /tmp/aotl-v02-delivery/
          cp game/crownsfall_lootslice/tools/restore_rig_v02.py /tmp/aotl-v02-delivery/
          cp -r /tmp/aotl-v02-qa /tmp/aotl-v02-delivery/native_tests
          cd /tmp && zip -qr aotl-v02-verified.zip aotl-v02-delivery
      - name: Upload V02 model and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aotl-v02-native-qa
          path: |
            /tmp/aotl-v02-verified.zip
            /tmp/aotl-v02-qa/
          if-no-files-found: ignore
