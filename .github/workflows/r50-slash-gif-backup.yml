name: AOTL R50 actual full-body Slash GIF archive

on:
  push:
    branches: [dev/r50-slash-weighttransfer-ik-v1]
    paths:
      - .github/workflows/r50-slash-gif-backup.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: Download authentic Blender R50 frame GIF
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --max-time 100 \
            "https://d2ol7oe51mr4n9.cloudfront.net/user_3LvftKotfPTUOd7ljqK6GWH6rIX/b6c9d36f-0a8e-44fe-9101-02ed5621f09d.zip?download=AOTL_R50_Real_Slash_Preview.zip" \
            -o /tmp/r50-preview.zip
          echo "8db32f0dab12c56bfbaffd2cf90d5c0fbd8e7462862cb8ef766b5a47de4815a2  /tmp/r50-preview.zip" | sha256sum --check -
          mkdir -p game/crownsfall_lootslice/previews/warrior_r50
          unzip -p /tmp/r50-preview.zip AOTL_R50_FullBody_Slash_RealKeyframes.gif > game/crownsfall_lootslice/previews/warrior_r50/real_fullbody_slash.gif
          unzip -p /tmp/r50-preview.zip AOTL_R50_Preview_Provenance.json > game/crownsfall_lootslice/previews/warrior_r50/provenance.json
          echo "cbbe988b2ccfbd9476427a7512be88091ae8482efc7b879a8ccf4c21d12f0da7  game/crownsfall_lootslice/previews/warrior_r50/real_fullbody_slash.gif" | sha256sum --check -
          python3 - <<'PY'
          import pathlib,json
          d=pathlib.Path('game/crownsfall_lootslice/previews/warrior_r50')
          a=json.loads((d/'provenance.json').read_text())
          assert a['frames']==[1,5,9,12,15,19,23]
          assert not a['invented_inbetweens']
          assert (d/'real_fullbody_slash.gif').read_bytes()[:6] in (b'GIF89a',b'GIF87a')
          print('R50 actual Blender animation source frames verified')
          PY
      - name: Commit reversible animation preview and metadata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game/crownsfall_lootslice/previews/warrior_r50/
          if ! git diff --cached --quiet; then
            git commit -m "Preserve real R50 full-body Slash seven-frame preview and provenance"
            git push origin HEAD:dev/r50-slash-weighttransfer-ik-v1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: AOTL-R50-Real-Blender-Slash-Preview
          path: /tmp/r50-preview.zip
          retention-days: 30
          if-no-files-found: error
