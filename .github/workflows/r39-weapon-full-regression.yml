name: AOTL R39 weapon sweep full Crownsfall regression

on:
  push:
    branches: [dev/r39-weapon-sweep-v1]
    paths:
      - .github/workflows/r39-weapon-full-regression.yml
      - game/crownsfall_lootslice/tests/lab_roundtrip.gd
      - game/crownsfall_lootslice/scripts/three_d/rig_controller.gd
      - game/crownsfall_lootslice/scripts/three_d/rig_lab.gd
      - game/crownsfall_lootslice/scripts/three_d/hurtbox3d.gd
      - game/crownsfall_lootslice/scripts/three_d/training_dummy.gd
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full_regression:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Install Godot 4.6.3
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --max-time 180 "https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.6.3-stable_linux.x86_64
      - name: Confirm production R39 Warrior asset unchanged
        run: |
          echo "6e72468f2bfa6344c66c57cd0157c36949b53d8bb24f8d30c955da5f72e0ba55  game/crownsfall_lootslice/models/AOTL_Warrior_R39.glb" | sha256sum --check -
      - name: Run isolated Crownsfall suites
        shell: bash
        run: |
          set -o pipefail
          python3 game/crownsfall_lootslice/tools/run_checks.py \
            --project game/crownsfall_lootslice \
            --godot /tmp/Godot_v4.6.3-stable_linux.x86_64 \
            --report-dir /tmp/aotl-r39-weapon-fullqa 2>&1 | tee /tmp/aotl-r39-weapon-console.log
      - name: Verify exactly 994 assertions pass
        run: |
          python3 - <<'PY'
          import json
          path='/tmp/aotl-r39-weapon-fullqa/summary.json'
          report=json.load(open(path))
          assert report['success'] and report['unique_assertions']==994 and len(report['suites'])==17, report
          print('AOTL R39 WEAPON FULL REGRESSION PASS 994/994 assertions; 17/17 suites')
          PY
      - name: Preserve all 17 suite logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AOTL-R39-Weapon-Contact-Full-994-QA
          path: |
            /tmp/aotl-r39-weapon-fullqa/
            /tmp/aotl-r39-weapon-console.log
          if-no-files-found: warn
          retention-days: 30
