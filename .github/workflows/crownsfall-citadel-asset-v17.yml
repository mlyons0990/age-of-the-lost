name: Crownsfall Citadel V17 — sculpted masonry textures and safe variant

on:
  push:
    branches:
      - feature/phase17-citadel-masonry-texture-and-occlusion
  pull_request:
    paths:
      - 'game/crownsfall_lootslice/tools/build_citadel_art_glb_v15.py'
      - 'game/crownsfall_lootslice/tools/requirements_citadel_v15.txt'
      - 'game/crownsfall_lootslice/tests/test_citadel_art_glb_v15.py'
      - 'game/crownsfall_lootslice/tests/citadel_art_import_v15.gd'
      - 'game/crownsfall_lootslice/tests/citadel_art_swap_v16.gd'
      - 'game/crownsfall_lootslice/tests/citadel_masonry_v17.gd'
      - 'game/crownsfall_lootslice/tests/citadel_nav_hardening_v19.gd'
      - 'game/crownsfall_lootslice/tests/citadel_toggle_stress_v19.gd'
      - 'game/crownsfall_lootslice/tests/test_citadel_masonry_v17.py'
      - 'game/crownsfall_lootslice/tests/test_phase18_citadel_recovery_audit.py'
      - 'game/crownsfall_lootslice/tests/test_phase18_citadel_immutable_backup.py'
      - 'game/crownsfall_lootslice/tools/phase18_citadel_immutable_backup.py'
      - 'game/crownsfall_lootslice/tools/phase18_stage_citadel_candidate.py'
      - 'game/crownsfall_lootslice/tests/test_phase18_stage_citadel_candidate.py'
      - 'game/crownsfall_lootslice/tools/phase18_citadel_recovery_audit.py'
      - 'game/crownsfall_lootslice/tools/phase20_batch_sculpt_details.py'
      - 'game/crownsfall_lootslice/tools/validate_citadel_sculpt_v20_v08.py'
      - 'game/crownsfall_lootslice/tests/test_phase20_batch_manifest.py'
      - 'game/crownsfall_lootslice/data/citadel_phase20_batch_manifest.json'
      - 'game/crownsfall_lootslice/data/citadel_phase20_uv_batch_v09_manifest.json'
      - 'game/crownsfall_lootslice/tests/test_phase20_uv_batch_manifest.py'
      - 'game/crownsfall_lootslice/tests/test_phase21_external_glb_gate.py'
      - 'game/crownsfall_lootslice/tests/citadel_external_glb_import_v21.gd'
      - 'game/crownsfall_lootslice/tools/phase21_bundle_external_art.py'
      - 'game/crownsfall_lootslice/tests/test_phase21_bundle_external_art.py'
      - 'game/crownsfall_lootslice/data/citadel_phase21_export_lod_manifest.json'
      - 'game/crownsfall_lootslice/tools/phase21_external_glb_gate.py'
      - 'game/crownsfall_lootslice/tools/phase21_thin_bevel_export_lod.py'
      - 'game/crownsfall_lootslice/assets/25d/citadel/AOTL_Citadel_Higgsfield_Optimized_v10.glb'
      - 'game/crownsfall_lootslice/tools/phase20_uv_preserving_decor_batch.py'
      - 'game/crownsfall_lootslice/tools/validate_citadel_sculpt_v20_v09.py'
      - 'game/crownsfall_lootslice/tools/build_citadel_art_v17.py'
      - 'game/crownsfall_lootslice/scripts/two_point_five_d/**'
      - '.github/workflows/crownsfall-citadel-asset-v17.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-art-mesh-and-godot-import:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      XDG_DATA_HOME: /tmp/aotl-ci-data
      XDG_CACHE_HOME: /tmp/aotl-ci-cache
      XDG_CONFIG_HOME: /tmp/aotl-ci-config
    steps:
      - name: Checkout all Crownsfall game assets
        uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: false
      - name: Python 3.11 for reproducible art asset build
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deterministic mesh exporter
        run: |
          python -m pip install -r game/crownsfall_lootslice/tools/requirements_citadel_v15.txt
          python -m pip install 'Pillow>=10,<13'
      - name: Build real GLB + manifest from source
        run: |
          cd game/crownsfall_lootslice
          python tools/build_citadel_art_glb_v15.py
      - name: Validate binary mesh, landings, topology, and no gameplay authority
        run: |
          cd game/crownsfall_lootslice
          python tests/test_citadel_art_glb_v15.py 2>&1 | tee citadel_v15_static.log
      - name: Build new art-only 1197-mesh Citadel textured GLB
        run: |
          cd game/crownsfall_lootslice
          python tools/build_citadel_art_v17.py
      - name: Audit new textured masonry topology, routes and source
        run: |
          cd game/crownsfall_lootslice
          python tests/test_citadel_masonry_v17.py 2>&1 | tee citadel_v17_static.log
      - name: Phase 18 recovery audit fails closed and never edits approved source
        run: |
          cd game/crownsfall_lootslice
          python -m unittest discover -s tests -p 'test_phase18_citadel_recovery_audit.py' -v
          python -m unittest discover -s tests -p 'test_phase18_citadel_immutable_backup.py' -v
          python -m unittest discover -s tests -p 'test_phase18_stage_citadel_candidate.py' -v
      - name: Phase 20 optimized mesh provenance checks
        run: |
          cd game/crownsfall_lootslice
          python -m unittest discover -s tests -p 'test_phase20_batch_manifest.py' -v
          python -m unittest discover -s tests -p 'test_phase20_uv_batch_manifest.py' -v
      - name: Phase 22 validate actual Higgsfield v10 binary and checksum
        run: |
          cd game/crownsfall_lootslice
          echo '91468793913600410d1665bfed0f3acdf6d733ed5f3ab13b0c8796f944329a64  assets/25d/citadel/AOTL_Citadel_Higgsfield_Optimized_v10.glb' | sha256sum -c -
          python tools/phase21_external_glb_gate.py assets/25d/citadel/AOTL_Citadel_Higgsfield_Optimized_v10.glb --mesh-nodes 309 --max-triangles 27000 --min-images 2 --expected-sha256 91468793913600410d1665bfed0f3acdf6d733ed5f3ab13b0c8796f944329a64
      - name: Phase 21 external GLB binary safety gate
        run: |
          cd game/crownsfall_lootslice
          python -m unittest discover -s tests -p 'test_phase21_external_glb_gate.py' -v
          python -m unittest discover -s tests -p 'test_phase21_bundle_external_art.py' -v
      - name: Install Godot 4.6.3
        uses: solarlabyrinth/action-setup-godot@v3
        with:
          version: 4.6.3-stable
          export-templates: false
      - name: Confirm engine version
        run: godot --version
      - name: Import Godot source and built GLB
        run: godot --headless --path game/crownsfall_lootslice --editor --import --quit
      - name: Verify imported GLB scene in real engine
        run: godot --headless --path game/crownsfall_lootslice --script res://tests/citadel_art_import_v15.gd
      - name: Phase 12 stair geometry headless checks
        run: godot --headless --path game/crownsfall_lootslice --script res://tests/citadel_grade_geometry_v12.gd
      - name: Phase 13 grade bridge headless checks
        run: godot --headless --path game/crownsfall_lootslice --script res://tests/citadel_depth_bridge_v13.gd
      - name: Phase 16 real GLB art swap and indexed nav tests
        run: timeout 90s godot --headless --path game/crownsfall_lootslice --script res://tests/citadel_art_swap_v16.gd
      - name: Phase 17 isolated GLB import and non-destructive visual route tests
        run: timeout 90s godot --headless --path game/crownsfall_lootslice --script res://tests/citadel_masonry_v17.gd
      - name: Phase 21 standalone GLTFDocument import gate on isolated V17 fixture
        run: timeout 90s godot --headless --path game/crownsfall_lootslice --script res://tests/citadel_external_glb_import_v21.gd -- --model=res://assets/25d/citadel/AOTL_Citadel_MasonryArt_v17.glb --variant=v17
      - name: Phase 22 real optimized Higgsfield v10 GLB imported by Godot 4.6.3
        run: timeout 120s godot --headless --path game/crownsfall_lootslice --script res://tests/citadel_external_glb_import_v21.gd -- --model=res://assets/25d/citadel/AOTL_Citadel_Higgsfield_Optimized_v10.glb --variant=v10
      - name: Phase 19 adaptive navigation gap and shoulder checks in Godot
        run: timeout 90s godot --headless --path game/crownsfall_lootslice --script res://tests/citadel_nav_hardening_v19.gd
      - name: Phase 19 repeated 3D art and collision fallback stress
        run: timeout 120s godot --headless --path game/crownsfall_lootslice --script res://tests/citadel_toggle_stress_v19.gd
      - name: Render original Phase 16 Citadel fallback baseline in Godot
        run: |
          which xvfb-run || (sudo apt-get update -qq && sudo apt-get install -y xvfb)
          timeout 90s xvfb-run -a godot --path game/crownsfall_lootslice --rendering-method gl_compatibility --script res://tests/citadel_visual_capture_v16.gd
      - name: Render standalone Citadel art in real Godot OpenGL under virtual X display
        run: |
          which xvfb-run || (sudo apt-get update -qq && sudo apt-get install -y xvfb)
          timeout 90s xvfb-run -a godot --path game/crownsfall_lootslice --rendering-method gl_compatibility --script res://tests/citadel_visual_capture_v17.gd
      - name: Archive actual renderer screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aotl-citadel-v17-render-review
          path: |
            game/crownsfall_lootslice/citadel_v16_render.png
            game/crownsfall_lootslice/citadel_v17_render.png
          if-no-files-found: warn
          retention-days: 30
      - name: Preserve portable GLB for engine integration
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aotl-citadel-v17-detail-glb-and-qa
          path: |
            game/crownsfall_lootslice/assets/25d/citadel/AOTL_Citadel_ArtFallback_v15.glb
            game/crownsfall_lootslice/assets/25d/citadel/AOTL_Citadel_ArtFallback_v15.json
            game/crownsfall_lootslice/citadel_v15_static.log
            game/crownsfall_lootslice/assets/25d/citadel/AOTL_Citadel_MasonryArt_v17.glb
            game/crownsfall_lootslice/assets/25d/citadel/AOTL_Citadel_MasonryArt_v17.json
            game/crownsfall_lootslice/citadel_v17_static.log
          if-no-files-found: warn
          retention-days: 30
