name: Crownsfall Phase 23 — Painterly Atlas GLB Rebuild and Godot Visual QA

on:
  push:
    branches:
      - feature/phase17-citadel-masonry-texture-and-occlusion
    paths:
      - 'game/crownsfall_lootslice/tools/phase23_painterly_citadel_atlas.py'
      - 'game/crownsfall_lootslice/tools/phase23_rebuild_from_v10.py'
      - 'game/crownsfall_lootslice/tests/test_citadel_painterly_v23.py'
      - 'game/crownsfall_lootslice/tests/citadel_material_grade_v23.gd'
      - 'game/crownsfall_lootslice/tests/citadel_visual_capture_v23.gd'
      - '.github/workflows/crownsfall-phase23-material-rebuild.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-blender-to-godot-painterly:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      XDG_DATA_HOME: /tmp/aotl-p23-data
      XDG_CACHE_HOME: /tmp/aotl-p23-cache
      XDG_CONFIG_HOME: /tmp/aotl-p23-config
    steps:
      - name: Checkout original verified art without rewriting canonical source
        uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: false
      - name: Python 3.11 for GLB evidence and QA
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Blender and virtual display for isolated material rebuild
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends blender xvfb python3-numpy
          blender --version
      - name: Generate Phase 23 packed 1024px stone and 512px ivy maps in Blender
        run: |
          cd game/crownsfall_lootslice
          blender --background --factory-startup --python-exit-code 1 --python tools/phase23_rebuild_from_v10.py -- \
            --source assets/25d/citadel/AOTL_Citadel_Higgsfield_Optimized_v10.glb \
            --output assets/25d/citadel/AOTL_Citadel_Painterly_v13.glb \
            --blend-output "$RUNNER_TEMP/AOTL_Citadel_Painterly_v13_Editable.blend"
      - name: Verify source unchanged, 3 true embedded PNG maps, UV and arch/stair integrity
        run: |
          cd game/crownsfall_lootslice
          echo '91468793913600410d1665bfed0f3acdf6d733ed5f3ab13b0c8796f944329a64  assets/25d/citadel/AOTL_Citadel_Higgsfield_Optimized_v10.glb' | sha256sum -c -
          python tests/test_citadel_painterly_v23.py
          python tools/phase21_external_glb_gate.py \
            assets/25d/citadel/AOTL_Citadel_Painterly_v13.glb \
            --mesh-nodes 309 --max-triangles 27000 --min-images 3
      - name: Install Godot 4.6.3
        uses: solarlabyrinth/action-setup-godot@v3
        with:
          version: 4.6.3-stable
          export-templates: false
      - name: Import original and derived painterly GLB inside disposable Godot workspace
        run: godot --headless --path game/crownsfall_lootslice --editor --import --quit
      - name: Direct Godot GLTFDocument import of Phase 23 derived 309-mesh GLB
        run: |
          timeout 120s godot --headless --path game/crownsfall_lootslice --script \
            res://tests/citadel_external_glb_import_v21.gd -- \
            --model=res://assets/25d/citadel/AOTL_Citadel_Painterly_v13.glb --variant=v10
      - name: Validate painterly textures, iris/ivy and full Citadel grade in engine
        run: |
          timeout 120s godot --headless --path game/crownsfall_lootslice --script \
            res://tests/citadel_material_grade_v23.gd
      - name: Render baseline versus painted Citadel at 1080p and 1440p
        run: |
          timeout 180s xvfb-run -a godot --path game/crownsfall_lootslice \
            --rendering-method gl_compatibility --script \
            res://tests/citadel_visual_capture_v23.gd
          for size in 1920x1080 2560x1440; do
            for variant in baseline painted; do
              test -s "game/crownsfall_lootslice/citadel_phase23_${variant}_${size}.png"
            done
          done
      - name: Upload actual Phase 23 GLB, Blender source and Godot PNG comparison kit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AOTL_Phase23_Painterly_Citadel_GLB_and_Godot_1080_1440
          if-no-files-found: warn
          compression-level: 0
          retention-days: 60
          path: |
            game/crownsfall_lootslice/assets/25d/citadel/AOTL_Citadel_Painterly_v13.glb
            game/crownsfall_lootslice/assets/25d/citadel/AOTL_Citadel_Painterly_v13.qa.json
            ${{ runner.temp }}/AOTL_Citadel_Painterly_v13_Editable.blend
            game/crownsfall_lootslice/citadel_phase23_baseline_1920x1080.png
            game/crownsfall_lootslice/citadel_phase23_painted_1920x1080.png
            game/crownsfall_lootslice/citadel_phase23_baseline_2560x1440.png
            game/crownsfall_lootslice/citadel_phase23_painted_2560x1440.png
