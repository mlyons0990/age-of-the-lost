name: Validate AOTL Warrior R39 in Godot 4.3

on:
  push:
    branches: [assets/warrior-r39-sixclip]
    paths:
      - .github/workflows/warrior-r39-godot-ci.yml
      - game/crownsfall_lootslice/tests/verify_warrior_r39_import.gd
  workflow_dispatch:

permissions:
  contents: read

jobs:
  godot_import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: Restore only the checksum-verified R39 GLB from Git LFS
        shell: bash
        run: |
          set -euo pipefail
          git lfs install --local
          git lfs pull --include="game/crownsfall_lootslice/models/AOTL_Warrior_R39_Gameplay6.glb" --exclude=""
          echo "6e72468f2bfa6344c66c57cd0157c36949b53d8bb24f8d30c955da5f72e0ba55  game/crownsfall_lootslice/models/AOTL_Warrior_R39_Gameplay6.glb" | sha256sum --check -
      - name: Download official Godot 4.3 stable CLI
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --max-time 180 \
            "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.3-stable_linux.x86_64
          /tmp/godot/Godot_v4.3-stable_linux.x86_64 --headless --version
      - name: Create isolated Godot asset-import acceptance project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/aotl-warrior-r39/models /tmp/aotl-warrior-r39/tests
          cp game/crownsfall_lootslice/models/AOTL_Warrior_R39_Gameplay6.glb /tmp/aotl-warrior-r39/models/
          cp game/crownsfall_lootslice/tests/verify_warrior_r39_import.gd /tmp/aotl-warrior-r39/tests/
          cat > /tmp/aotl-warrior-r39/project.godot <<'EOF'
          config_version=5
          [application]
          config/name="AOTL Warrior R39 Import QA"
          config/features=PackedStringArray("4.3", "GL Compatibility")
          [rendering]
          renderer/rendering_method="gl_compatibility"
          renderer/rendering_method.mobile="gl_compatibility"
          EOF
      - name: Import model and verify its live skeleton and six animation actions
        shell: bash
        run: |
          set -euo pipefail
          GODOT=/tmp/godot/Godot_v4.3-stable_linux.x86_64
          "$GODOT" --headless --path /tmp/aotl-warrior-r39 --editor --quit 2>&1 | tee /tmp/aotl-import.log
          "$GODOT" --headless --path /tmp/aotl-warrior-r39 --script res://tests/verify_warrior_r39_import.gd 2>&1 | tee /tmp/aotl-r39-validation.log
          grep -q "AOTL Warrior R39 Gameplay6 IMPORT PASS" /tmp/aotl-r39-validation.log
      - name: Preserve Godot import test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AOTL-R39-Godot43-Import-Logs
          path: |
            /tmp/aotl-import.log
            /tmp/aotl-r39-validation.log
          if-no-files-found: warn
          retention-days: 30
