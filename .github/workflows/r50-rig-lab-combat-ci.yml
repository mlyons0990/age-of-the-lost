name: AOTL R50 full Crownsfall rig-lab combat acceptance

on:
  push:
    branches: [dev/r50-slash-weighttransfer-ik-v1]
    paths:
      - .github/workflows/r50-rig-lab-combat-ci.yml
      - game/crownsfall_lootslice/tests/verify_r50_rig_lab_optin.gd
      - game/crownsfall_lootslice/scripts/three_d/rig_lab.gd
  workflow_dispatch:

permissions:
  contents: read

jobs:
  combat:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Verify real model checksums
        shell: bash
        run: |
          set -euo pipefail
          echo "6e72468f2bfa6344c66c57cd0157c36949b53d8bb24f8d30c955da5f72e0ba55  game/crownsfall_lootslice/models/AOTL_Warrior_R39.glb" | sha256sum --check -
          echo "b1a600ca144ccfc7a868d6e4936964a74c3afe55882c5e8166e3f65a26561a16  game/crownsfall_lootslice/models/AOTL_Warrior_R50_SevenClip_Candidate.glb" | sha256sum --check -
      - name: Install Godot 4.6.3
        run: |
          set -euo pipefail
          curl -fL --retry 3 --max-time 180 "https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.6.3-stable_linux.x86_64
      - name: Run actual full R50 rig lab, training dummies and swept sword
        shell: bash
        run: |
          set -euo pipefail
          export XDG_DATA_HOME=/tmp/aotl-r50-riglab-data
          export XDG_CONFIG_HOME=/tmp/aotl-r50-riglab-config
          export XDG_CACHE_HOME=/tmp/aotl-r50-riglab-cache
          GODOT=/tmp/Godot_v4.6.3-stable_linux.x86_64
          "$GODOT" --headless --path game/crownsfall_lootslice --editor --quit 2>&1 | tee /tmp/aotl-r50-lab-import.log
          "$GODOT" --headless --path game/crownsfall_lootslice --script res://tests/verify_r50_rig_lab_optin.gd 2>&1 | tee /tmp/aotl-r50-lab-combat.log
          grep -q 'AOTL R50 RIG LAB RESULT 13 checks; 0 failures' /tmp/aotl-r50-lab-combat.log
          if grep -E '^ERROR:|SCRIPT ERROR|^FAIL ' /tmp/aotl-r50-lab-import.log /tmp/aotl-r50-lab-combat.log; then exit 1; fi
      - name: Preserve full R50 combat logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AOTL-R50-Rig-Lab-Combat-13-QA
          path: |
            /tmp/aotl-r50-lab-import.log
            /tmp/aotl-r50-lab-combat.log
          if-no-files-found: warn
          retention-days: 30
