name: AOTL R39 weapon sweep geometry QA

on:
  push:
    branches: [dev/r39-weapon-sweep-v1]
    paths:
      - .github/workflows/r39-weapon-sweep-ci.yml
      - game/crownsfall_lootslice/scripts/three_d/weapon_sweep3d.gd
      - game/crownsfall_lootslice/tests/weapon_sweep3d_integration.gd
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.6.3
        run: |
          set -euo pipefail
          curl -fL --retry 3 --max-time 180 "https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.6.3-stable_linux.x86_64
      - name: Run weapon sweep timing and geometry acceptance
        shell: bash
        run: |
          set -euo pipefail
          p=/tmp/aotl-weapon-sweep-test
          mkdir -p "$p/scripts/three_d" "$p/tests"
          cp game/crownsfall_lootslice/scripts/three_d/weapon_sweep3d.gd "$p/scripts/three_d/"
          cp game/crownsfall_lootslice/tests/weapon_sweep3d_integration.gd "$p/tests/"
          cat > "$p/project.godot" <<'EOF'
          config_version=5
          [application]
          config/name="AOTL Weapon Sweep QA"
          config/features=PackedStringArray("4.6", "GL Compatibility")
          [rendering]
          renderer/rendering_method="gl_compatibility"
          EOF
          GODOT=/tmp/Godot_v4.6.3-stable_linux.x86_64
          "$GODOT" --headless --path "$p" --editor --quit 2>&1 | tee /tmp/aotl-weapon-import.log
          "$GODOT" --headless --path "$p" --script res://tests/weapon_sweep3d_integration.gd 2>&1 | tee /tmp/aotl-weapon-geometry.log
          grep -q 'AOTL WEAPON SWEEP RESULT 23 checks; 0 failures' /tmp/aotl-weapon-geometry.log
          if grep -E '^ERROR:|SCRIPT ERROR|^FAIL ' /tmp/aotl-weapon-import.log /tmp/aotl-weapon-geometry.log; then exit 1; fi
      - name: Preserve tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AOTL-R39-Weapon-Sweep-Geometry-Logs
          path: |
            /tmp/aotl-weapon-import.log
            /tmp/aotl-weapon-geometry.log
          if-no-files-found: warn
          retention-days: 30
