name: AOTL R39 strict physical blade gameplay QA

on:
  push:
    branches: [dev/r39-weapon-sweep-v1]
    paths:
      - .github/workflows/r39-weapon-strict-ci.yml
      - game/crownsfall_lootslice/tests/weapon_sweep_strict_live_integration.gd
      - game/crownsfall_lootslice/scripts/three_d/weapon_sweep3d.gd
      - game/crownsfall_lootslice/scripts/three_d/rig_lab.gd
  workflow_dispatch:

permissions:
  contents: read

jobs:
  strict_blade:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Install Godot 4.6.3
        run: |
          set -euo pipefail
          curl -fL --retry 3 --max-time 180 "https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.6.3-stable_linux.x86_64
      - name: Run real R39 strict physical sword collision acceptance
        shell: bash
        run: |
          set -euo pipefail
          echo "6e72468f2bfa6344c66c57cd0157c36949b53d8bb24f8d30c955da5f72e0ba55  game/crownsfall_lootslice/models/AOTL_Warrior_R39.glb" | sha256sum -c
          export XDG_DATA_HOME=/tmp/aotl-r39-strict-data
          export XDG_CONFIG_HOME=/tmp/aotl-r39-strict-config
          export XDG_CACHE_HOME=/tmp/aotl-r39-strict-cache
          GODOT=/tmp/Godot_v4.6.3-stable_linux.x86_64
          "$GODOT" --headless --path game/crownsfall_lootslice --editor --quit 2>&1 | tee /tmp/aotl-r39-strict-import.log
          "$GODOT" --headless --path game/crownsfall_lootslice --script res://tests/weapon_sweep_strict_live_integration.gd 2>&1 | tee /tmp/aotl-r39-strict-live.log
          grep -q 'AOTL R39 STRICT BLADE RESULT 10 checks; 0 failures' /tmp/aotl-r39-strict-live.log
          if grep -E '^ERROR:|SCRIPT ERROR|^FAIL ' /tmp/aotl-r39-strict-import.log /tmp/aotl-r39-strict-live.log; then exit 1; fi
      - name: Preserve strict physical collision evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AOTL-R39-Strict-Blade-Physics-QA
          path: |
            /tmp/aotl-r39-strict-import.log
            /tmp/aotl-r39-strict-live.log
          if-no-files-found: warn
          retention-days: 30
