name: AOTL R39 live sword contact and full project QA

on:
  push:
    branches: [dev/r39-weapon-sweep-v1]
    paths:
      - .github/workflows/r39-weapon-live-ci.yml
      - game/crownsfall_lootslice/scripts/three_d/weapon_sweep3d.gd
      - game/crownsfall_lootslice/scripts/three_d/rig_controller.gd
      - game/crownsfall_lootslice/scripts/three_d/rig_lab.gd
      - game/crownsfall_lootslice/tests/weapon_sweep_live_integration.gd
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live_sword:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Install Godot 4.6.3
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --max-time 180 "https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.6.3-stable_linux.x86_64
      - name: Validate unchanged Warrior and execute actual animation test
        shell: bash
        run: |
          set -euo pipefail
          echo "6e72468f2bfa6344c66c57cd0157c36949b53d8bb24f8d30c955da5f72e0ba55  game/crownsfall_lootslice/models/AOTL_Warrior_R39.glb" | sha256sum --check -
          export XDG_DATA_HOME=/tmp/aotl-r39-weapon-data
          export XDG_CONFIG_HOME=/tmp/aotl-r39-weapon-config
          export XDG_CACHE_HOME=/tmp/aotl-r39-weapon-cache
          GODOT=/tmp/Godot_v4.6.3-stable_linux.x86_64
          "$GODOT" --headless --path game/crownsfall_lootslice --editor --quit 2>&1 | tee /tmp/aotl-weapon-live-import.log
          "$GODOT" --headless --path game/crownsfall_lootslice --script res://tests/weapon_sweep_live_integration.gd 2>&1 | tee /tmp/aotl-weapon-live-test.log
          grep -q 'AOTL R39 LIVE WEAPON CONTACT RESULT 11 checks; 0 failures' /tmp/aotl-weapon-live-test.log
          if grep -E '^ERROR:|SCRIPT ERROR|^FAIL ' /tmp/aotl-weapon-live-import.log /tmp/aotl-weapon-live-test.log; then exit 1; fi
      - name: Archive real animation contact diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AOTL-R39-Live-Weapon-Contact-Logs
          path: |
            /tmp/aotl-weapon-live-import.log
            /tmp/aotl-weapon-live-test.log
          if-no-files-found: warn
          retention-days: 30
